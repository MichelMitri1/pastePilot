[package]
name = "pastepilot"
version = "1.3.0"
description = "Menu bar assistant that drafts support replies from selected text"
edition = "2021"

[lib]
name = "pastepilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls-alpn", "http2", "stream", "multipart"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["time"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tauri-plugin-updater = "2"
cpal = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSNotification", "NSOperation", "NSData", "NSArray", "NSGeometry", "NSAttributedString", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSPasteboard", "NSPasteboardItem", "NSPanel", "NSWindow", "NSResponder", "NSView", "NSVisualEffectView", "NSTextField", "NSControl", "NSText", "NSColor", "NSFont", "NSScreen", "NSGraphics", "NSApplication", "NSCell", "NSButton", "NSButtonCell", "NSPopUpButton", "NSMenu", "NSMenuItem", "NSAppearance", "block2"] }
block2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
