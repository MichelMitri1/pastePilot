# Builds PastePilot for Windows.
#
# - Release tag (pushed by `npm run release`): adds PastePilot-Setup.exe to that
#   GitHub release and lists it in latest.json, so installed Windows copies update.
# - Run manually (Actions → Windows → Run workflow): builds an installer from
#   the chosen branch and attaches it to the run, for testing.
name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ "$RELEASE" = "true" ]; then
            if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret (the contents of ~/.tauri/pastepilot.key). Without it, installed apps won't accept the update."
              exit 1
            fi
            npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npx tauri build --bundles nsis
          fi
          cp src-tauri/target/release/bundle/nsis/*-setup.exe PastePilot-Setup.exe

      - name: Upload test build
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PastePilot-Setup
          path: PastePilot-Setup.exe

      - name: Add to the release
        if: env.RELEASE == 'true'
        run: |
          tag="${GITHUB_REF_NAME}"
          # The Mac release is created right after the tag is pushed.
          for i in $(seq 1 30); do gh release view "$tag" > /dev/null 2>&1 && break; sleep 20; done
          gh release download "$tag" --pattern latest.json --clobber
          SIGNATURE="$(cat src-tauri/target/release/bundle/nsis/*-setup.exe.sig)" \
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/PastePilot-Setup.exe" \
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            manifest.platforms["windows-x86_64"] = { signature: process.env.SIGNATURE.trim(), url: process.env.URL };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2) + "\n");
          '
          gh release upload "$tag" PastePilot-Setup.exe latest.json --clobber
